name: Stationary Doppler regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make -f Makefile.doppler test
      - run: |
          cc -O1 -g -std=c99 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_doppler.c -o build-doppler/test-sanitize -lm -pthread
          ./build-doppler/test-sanitize
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - run: cmake -S . -B build -DUSE_OPENCL=OFF -DUSE_VULKAN=OFF
      - run: cmake --build build -j2
      - run: ./build/iridium-sniffer --help
